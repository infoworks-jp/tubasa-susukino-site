name: Verify runtime assets

on:
  workflow_call:
  workflow_dispatch:

# Asset verification must never write the repository or deploy independently.
# All publishing goes through pages.yml after both release gates pass.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the committed bundle matches its source
        run: |
          npm ci --ignore-scripts
          npm run build:fluid
          git diff --exit-code -- vendor/fluid-text.bundle.js
      - name: Verify committed local media
        run: |
          set -euo pipefail
          test -s assets/video/tsubasa-cm-vertical.mp4
          test -s assets/video/tsubasa-top-mobile.mp4
          test -s assets/video/tsubasa-top-pc.mp4
          test -s vendor/fluid-text.bundle.js
          ! grep -R 'esm.sh\|infoworks-jp.github.io/subasa-new-official' index.html app.js vendor/fluid-text.bundle.js
