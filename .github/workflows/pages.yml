name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  runtime-assets:
    uses: ./.github/workflows/localize-runtime-assets.yml
  steam-qa:
    uses: ./.github/workflows/visual-qa.yml
  location-qa:
    uses: ./.github/workflows/location-qa.yml
  location-reference:
    # Diagnostic only: external availability must not block the site gates.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify external Rokehan reference
        id: reference
        run: node tests/location-reference-qa.mjs
      - name: Report external reference failure
        if: failure()
        run: |
          echo "::warning::External Rokehan reference QA failed. See this job and its artifact; Tsubasa publication gates remain required."
          echo "External Rokehan reference QA failed; inspect the job logs and location-reference artifact. This diagnostic does not block publication." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: location-reference-${{ github.sha }}
          path: location-reference-qa/
          retention-days: 7
  deploy:
    needs: [steam-qa, runtime-assets, location-qa]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate approved public stories and SEO pages
        run: npm run build:seo
      - name: Require complete site assets
        run: |
          set -euo pipefail
          for f in index.html style.css app.js assets/ultimate-miso.webp assets/tsubasa-ramen.webp assets/susukino-top.webp assets/store-interior.webp assets/menu-ja.webp assets/menu-en.webp assets/menu-zh.webp assets/menu-ko.webp assets/logo-vertical.svg; do
            test -s "$f" || { echo "Missing required asset: $f"; exit 1; }
          done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
