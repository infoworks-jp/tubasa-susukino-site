name: Location Scout QA
on:
  workflow_call:
  pull_request:
    branches: [main]
    paths: ['location/**', 'location-data.geojson', 'tests/location-browser-qa.mjs', 'tests/alley-browser-qa.mjs', 'tests/plateau-data-qa.mjs', 'tests/facade-projection-qa.mjs', 'scripts/build-plateau.mjs', 'scripts/pack-plateau-textures.py', '.github/workflows/location-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  location:
    runs-on: ubuntu-latest
    # CPU WebGL runs the same detailed scenes and assertions as the M4 check.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reproducible location bundle
        run: |
          npm ci
          npm run build:location
          git diff --exit-code -- location/city.bundle.js
      - name: Verify PLATEAU source data and coordinate conversion
        run: node tests/plateau-data-qa.mjs
      - name: Verify photo facade perspective and UV bounds
        run: node tests/facade-projection-qa.mjs
      - run: npm install --no-save --package-lock=false playwright@1.55.0 pngjs@7.0.0
      - run: npx playwright install --with-deps chromium
      - name: Serve exact source and verify upstream and original implementation
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/location-server.log 2>&1 &
          node tests/location-browser-qa.mjs
          node tests/alley-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: location-scout-${{ github.sha }}
          path: location-qa/
          retention-days: 7
