name: Tsubasa Release Manager

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tsubasa-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: 1. Contract / upstream fluid architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce source and manager contract
        shell: bash
        run: |
          set -euo pipefail
          test -s GITHUB_MANAGER.md
          test -s reference/pavel-baseline.html
          test -s index.html
          test -s style.css
          test -s fluid-top.css
          test -s app.js
          test -s effects.js
          test -s assets/susukino-top.webp
          test -s assets/tsubasa-logo.png
          grep -q 'assets/tsubasa-logo.png' index.html
          grep -q 'data-effect="steam"' index.html
          grep -q '__tsubasaEffects' effects.js
          grep -q '外部基準実装を使用するWeb制作' GITHUB_MANAGER.md
          grep -q 'REFERENCE BASELINE' GITHUB_MANAGER.md
          grep -q '勝手に簡略化しない' GITHUB_MANAGER.md
          grep -q 'paveldogreat.github.io/WebGL-Fluid-Simulation' reference/pavel-baseline.html
      - name: Reject simplified or fake steam architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -Eqi 'advection|advect' effects.js
          grep -Eqi 'divergence|diverg' effects.js
          grep -Eqi 'pressure|jacobi' effects.js
          grep -Eqi 'gradient' effects.js
          grep -Eqi 'curl' effects.js
          grep -Eqi 'vorticity|vort' effects.js
          grep -Eqi 'splat' effects.js
          grep -Eqi 'framebuffer|createFramebuffer' effects.js
          grep -Eqi 'velocity|vel' effects.js
          grep -Eqi 'density|dye' effects.js
          grep -Eqi 'webgl2|webgl' effects.js
          if grep -q "webgl2-photographic-plume" effects.js; then echo 'FAIL: procedural plume shortcut is forbidden'; exit 1; fi
          if grep -q "gpu-fbm" effects.js; then echo 'FAIL: FBM-only smoke shortcut is forbidden'; exit 1; fi
      - name: Protect approved PNG logo
        shell: bash
        run: |
          set -euo pipefail
          bytes=$(wc -c < assets/tsubasa-logo.png)
          test "$bytes" -ge 30000
          test "$bytes" -le 500000
          file assets/tsubasa-logo.png | grep -q 'PNG image data'
      - name: Write contract receipt
        run: |
          mkdir -p manager
          sha256sum index.html style.css fluid-top.css app.js effects.js reference/pavel-baseline.html assets/susukino-top.webp assets/tsubasa-logo.png GITHUB_MANAGER.md > manager/source-sha256.txt
          printf 'commit=%s\nreference_baseline_required=YES\nstatus=CONTRACT_VERIFIED\n' "$GITHUB_SHA" > manager/contract.txt
      - uses: actions/upload-artifact@v4
        with:
          name: manager-contract-${{ github.sha }}
          path: manager
          retention-days: 30

  reference-baseline:
    name: 2. Pavel REFERENCE BASELINE
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install baseline browser QA
        run: |
          npm install --silent playwright@1.55.0 pixelmatch@7.1.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Serve this checkout
        run: python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/reference-server.log 2>&1 &
      - name: Capture and verify unmodified upstream behavior
        shell: bash
        run: |
          cat > baseline.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          import pixelmatch from 'pixelmatch';
          import { PNG } from 'pngjs';
          fs.mkdirSync('reference-evidence',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const report={commit:process.env.GITHUB_SHA,reference:'https://paveldogreat.github.io/WebGL-Fluid-Simulation/',passed:true,cases:{}};
          const diff=(a,b,out)=>{const A=PNG.sync.read(fs.readFileSync(a)),B=PNG.sync.read(fs.readFileSync(b));const D=new PNG({width:A.width,height:A.height});const n=pixelmatch(A.data,B.data,D.data,A.width,A.height,{threshold:.04,includeAA:true});fs.writeFileSync(out,PNG.sync.write(D));return n};
          for(const [name,width,height] of [['desktop',1440,1000],['mobile',390,844]]){
            const errors=[];
            const page=await browser.newPage({viewport:{width,height}});
            page.on('pageerror',e=>errors.push(`pageerror:${e.message}`));
            const url=`http://127.0.0.1:4174/reference/pavel-baseline.html?qa=${process.env.GITHUB_SHA}-${Date.now()}`;
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(2500);
            const frame=page.frames().find(f=>f.url().includes('paveldogreat.github.io/WebGL-Fluid-Simulation'));
            if(!frame){errors.push('upstream-frame-missing');report.passed=false;report.cases[name]={errors};await page.close();continue;}
            const canvas=frame.locator('canvas');
            await canvas.waitFor({state:'visible',timeout:15000});
            const box=await canvas.boundingBox();
            if(!box||box.width<100||box.height<100)errors.push('upstream-canvas-invalid');
            await page.screenshot({path:`reference-evidence/${name}-t0.png`});
            await page.waitForTimeout(1000);
            await page.screenshot({path:`reference-evidence/${name}-t1.png`});
            await page.waitForTimeout(2000);
            await page.screenshot({path:`reference-evidence/${name}-t3.png`});
            const d01=diff(`reference-evidence/${name}-t0.png`,`reference-evidence/${name}-t1.png`,`reference-evidence/${name}-diff-01.png`);
            const d13=diff(`reference-evidence/${name}-t1.png`,`reference-evidence/${name}-t3.png`,`reference-evidence/${name}-diff-13.png`);
            if(d01<1000||d13<1000)errors.push(`upstream-natural-motion-too-low:${d01}/${d13}`);
            let pointerDiff=-1;
            if(name==='desktop'&&box){
              const y=box.y+box.height*.52;
              await page.mouse.move(box.x+box.width*.25,y);
              await page.mouse.move(box.x+box.width*.75,y-80,{steps:24});
              await page.mouse.move(box.x+box.width*.45,y+70,{steps:18});
              await page.waitForTimeout(350);
              await page.screenshot({path:`reference-evidence/${name}-pointer.png`});
              pointerDiff=diff(`reference-evidence/${name}-t3.png`,`reference-evidence/${name}-pointer.png`,`reference-evidence/${name}-diff-pointer.png`);
              if(pointerDiff<1000)errors.push(`upstream-pointer-response-too-low:${pointerDiff}`);
            }
            report.cases[name]={canvas:box,naturalDiff01:d01,naturalDiff13:d13,pointerDiff,errors};
            if(errors.length)report.passed=false;
            await page.close();
          }
          await browser.close();
          fs.writeFileSync('reference-evidence/report.json',JSON.stringify(report,null,2));
          if(!report.passed)process.exit(1);
          JS
          node baseline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REFERENCE-BASELINE-${{ github.sha }}
          path: reference-evidence
          retention-days: 90

  browser:
    name: 3. This commit / ${{ matrix.browser-case }}
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser-case:
          [
            chromium-desktop,
            chromium-mobile,
            webkit-375,
            webkit-390,
            webkit-430,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install reproducible browser QA
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Serve this checkout
        run: python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/steam-server.log 2>&1 &
      - name: Compare rendered pixels and exercise lifecycle
        env:
          STEAM_QA_URL: http://127.0.0.1:4174/
          STEAM_QA_CASES: ${{ matrix.browser-case }}
          STEAM_QA_SOFTWARE: "1"
        run: node tests/steam-qa.mjs
      - name: Verify announcement layout and automatic JST expiration
        if: matrix.browser-case == 'chromium-desktop' || matrix.browser-case == 'webkit-390'
        env:
          NOTICE_QA_ENGINE: ${{ startsWith(matrix.browser-case, 'webkit') && 'webkit' || 'chromium' }}
          NOTICE_QA_OUTPUT: output/steam-qa/holiday-notice
        run: node tests/holiday-notice-qa.mjs
      - name: Verify approved boundaries and original bowl spacing
        env:
          STEAM_QA_CASES: ${{ matrix.browser-case }}
        run: node tests/boundary-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: steam-rendered-pixels-${{ github.sha }}-${{ matrix.browser-case }}
          path: output/steam-qa
          retention-days: 30

  manager:
    name: 4. Release gate
    needs: [contract, reference-baseline, browser]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Source contract, upstream baseline, all 12 steam roots and bowl stability verified for this checkout. Visual taste still requires human review.'
