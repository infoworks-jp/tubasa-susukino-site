name: Touch input diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  input:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/steam-server.log 2>&1 &
      - run: node tests/steam-touch-qa.mjs
        env:
          STEAM_QA_SOFTWARE: "1"
          TOUCH_QA_CASES: chrome-430
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touch-diagnosis
          path: output/steam-qa
