name: Native touch proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  input:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/steam-server.log 2>&1 &
      - name: Reproduce original input failure
        continue-on-error: true
        run: node tests/steam-touch-qa.mjs
        env:
          STEAM_QA_SOFTWARE: "1"
          TOUCH_QA_CASES: chrome-430
          TOUCH_QA_BASELINE: "1"
          TOUCH_QA_OUTPUT: output/steam-qa/baseline
      - name: Verify candidate input on all four bowls
        run: node tests/steam-touch-qa.mjs
        env:
          STEAM_QA_SOFTWARE: "1"
          TOUCH_QA_CASES: chrome-430,chrome-landscape
          TOUCH_QA_OUTPUT: output/steam-qa/candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-touch-proof
          path: output/steam-qa
